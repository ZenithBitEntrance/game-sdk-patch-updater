[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-sdk-patch-updater"
version = "0.6.3"
description = "Auto-updater and patch installer for bundled Game SDK runtimes on Windows."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "game-sdk-patch-updater maintainers" }]
keywords = ["game-sdk", "patcher", "auto-updater", "sdk", "windows", "modding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "httpx>=0.27,<0.29",       # async HTTP, used by the manifest fetcher
    "pydantic>=2.6,<3",        # manifest + state models, strict validation
    "semantic-version>=2.10",  # SDK version comparison across channels
    "zstandard>=0.22",         # patch blobs are zstd-compressed diffs
    "rich>=13.7",              # CLI progress + patch log rendering
    "portalocker>=2.8",        # cross-process lock on the SDK install root
    "pywin32>=306; sys_platform == 'win32'",  # registry + service hooks
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]
signed = ["cryptography>=42"]  # for signature verification on enterprise channels

[project.scripts]
sdkpatch = "game_sdk_patch_updater.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["game_sdk_patch_updater"]